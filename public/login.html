<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin MC - MC-Connect</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        var(--bg-main);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-gold), var(--shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header .brand-logo {
            justify-content: center;
            margin-bottom: 0.75rem;
        }
        .auth-title {
            font-size: 1.4rem;
            font-weight: 800;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-top: 0.25rem;
        }
        .alert-error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #F87171;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }
        .quick-demo-pill {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--gold-primary);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand-logo">
                    <div class="brand-icon">MC</div>
                    <div class="brand-text">MC-<span>Connect</span></div>
                </a>
                <h1 class="auth-title">🔐 Login Admin MC</h1>
                <p class="auth-subtitle">Masuk ke ruang kerja Event Command Center</p>
            </div>

            <div class="alert-error" id="loginAlert">
                Email atau kata sandi tidak cocok.
            </div>

            <div class="quick-demo-pill">
                <div>
                    <strong style="color:var(--gold-primary);">Demo Kredensial:</strong><br>
                    <code>vanya@mcconnect.id</code> / <code>password123</code>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillCredentials()" style="padding:0.3rem 0.6rem; font-size:0.78rem;">
                    Isi Cepat
                </button>
            </div>

            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Email Master of Ceremony *</label>
                    <input type="email" class="form-input" id="authEmail" value="vanya@mcconnect.id" required autofocus>
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                        <label class="form-label" style="margin-bottom:0;">Kata Sandi *</label>
                    </div>
                    <div style="position: relative;">
                        <input type="password" class="form-input" id="authPassword" value="password123" required style="padding-right: 40px;">
                        <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; color:var(--text-secondary);">
                    <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                        <input type="checkbox" checked style="accent-color:var(--gold-primary);">
                        Ingat Saya
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="btnLoginSubmit" style="width:100%;">
                    Masuk ke Admin Workspace ➔
                </button>

                <div style="text-align:center; margin-top:1.5rem; font-size:0.85rem;">
                    <a href="index.html" style="color:var(--text-muted);">
                        ◀ Kembali ke Portal Publik
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passInput = document.getElementById('authPassword');
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            
            if (type === 'text') {
                this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path></svg>';
            } else {
                this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        });

        function quickFillCredentials() {
            document.getElementById('authEmail').value = 'vanya@mcconnect.id';
            document.getElementById('authPassword').value = 'password123';
            showToast('Kredensial demo diisikan!', 'gold');
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const btn = document.getElementById('btnLoginSubmit');
            const alertBox = document.getElementById('loginAlert');

            btn.disabled = true;
            btn.textContent = 'Memverifikasi...';
            alertBox.style.display = 'none';

            try {
                const response = await fetch('/api/mc/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });

                const data = await response.json();

                if (data.success) {
                    // Set session auth token (simulated for static html)
                    sessionStorage.setItem('mc_auth_token', 'auth_token_' + data.user.id);
                    sessionStorage.setItem('mc_auth_user', JSON.stringify(data.user));

                    showToast('Login berhasil! Mengalihkan ke Admin Dashboard...', 'gold');
                    
                    // Ambil target redirect jika ada
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectTo = urlParams.get('redirect') || 'admin.html';

                    setTimeout(() => {
                        window.location.href = redirectTo;
                    }, 600);
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Masuk ke Admin Workspace ➔';
                    alertBox.textContent = data.message || 'Email atau kata sandi tidak cocok.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Masuk ke Admin Workspace ➔';
                alertBox.textContent = 'Gagal terhubung ke server Laravel. Pastikan php artisan serve berjalan.';
                alertBox.style.display = 'block';
                console.error(err);
            }
        }
    </script>
</body>
</html>
